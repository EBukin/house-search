project:
  type: website
  output-dir: ../docs
  execute-dir: project
  resources:
    - maps/*.html

website:
  title: "House search"
  navbar:
    left:
      - href: index.qmd
        text: All houses
      - text: Houses
        menu:
          # houses-menu-start (generated by R/03_site.R)
          - houses/option1.qmd
          - houses/option2.qmd
          # houses-menu-end
    right:
      - icon: github
        href: https://github.com/EBukin/house-search
  page-footer:
    center: "Cadastre: comune GisMaster portals · DTM: Regione Piemonte ICE 2009–2011 5 m LiDAR (CC BY 4.0)"

format:
  html:
    theme: cosmo
    toc: true
    page-layout: article

execute:
  echo: false
  warning: false
  message: false
